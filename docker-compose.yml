version: '3.9'

services:

  db:
    image: postgres:13
    container_name: db
    environment:
      - POSTGRES_DB=afriluck-v2
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_MAX_CONNECTIONS=500  # Increased from default 100
      - shared_buffers=4GB            # 25% of 16GB RAM
      - effective_cache_size=12GB     # 75% of RAM
      - work_mem=16MB                 # For complex sorts
      - maintenance_work_mem=1GB      # For vacuum operations
    ports:
      - "5431:5432"
    networks:
      - app-network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
        - DB_HOST=db
        - DB_PORT=5432
        - DB_USER=postgres
        - DB_PASSWORD=root
        - DB_NAME=afriluck-v2
        - POOL_MODE=transaction
        - AUTH_TYPE=md5
        - LISTEN_ADDR=0.0.0.0  # Explicitly listen on all interfaces
        - LISTEN_PORT=6432
        - DATABASES=afriluck-v2=host=db port=5432 dbname=afriluck-v2
        - MAX_CLIENT_CONN=1000       # (12GB - 2GB)/10MB = 1000
        - DEFAULT_POOL_SIZE=100      # Increased pool size
        - RESERVE_POOL_SIZE=50
        - SERVER_RESET_QUERY="DISCARD ALL"
    depends_on:
      - db
    ports:
      - "6432:6432" # Comment when replicating this
    volumes:
      - ./pgbouncer.ini:/opt/bitnami/pgbouncer/conf/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -p 6432 -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # App service (scalable replicas)
  app:
    image: stevesmart1113/afriluck:latest
    depends_on:
      - db
    restart: on-failure
    deploy:
      replicas: 5  # Start with 5, scale dynamically in production
      update_config:
        parallelism: 3
        delay: 10s
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pgbouncer:5432/afriluck-v2
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=20
      - JAVA_OPTS=-Xms2g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=100
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NGINX Load Balancer (optimized)
  nginx:
    build: ./nginx
    ports:
      - "8080:8080"
      - "443:443"  # Add if using SSL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - app-network
    depends_on:
      - app

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
    driver: local