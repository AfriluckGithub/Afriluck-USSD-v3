#    container_name: db
#    environment:
#      - POSTGRES_DB=afriluck-v2
#      - POSTGRES_USER=postgres
#      - POSTGRES_PASSWORD=root
#      - PGDATA=/var/lib/postgresql/data/pgdata
#    ports:
#      - "5431:5432"
