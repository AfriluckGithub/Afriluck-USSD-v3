version: '3.9'

services:

  db:
    image: postgres:13
    container_name: db
    environment:
      - POSTGRES_DB=afriluck-v2
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_MAX_CONNECTIONS=200  # Adjust based on RAM (rule: (RAM - 2GB) / 10MB)
    ports:
      - "5431:5432"
    networks:
      - app-network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    deploy:
      resources:
        limits:
          cpus: '4'  # Dedicate more CPU for DB under high load
          memory: 8G  # Increase if you have heavy queries
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PgBouncer for connection pooling (critical for high traffic)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
        - DB_HOST=db
        - DB_PORT=5432
        - DB_USER=postgres
        - DB_PASSWORD=root
        - DB_NAME=afriluck-v2
        - POOL_MODE=transaction
        - AUTH_TYPE=md5
        - LISTEN_ADDR=0.0.0.0  # Explicitly listen on all interfaces
        - LISTEN_PORT=6432
        - DATABASES=afriluck-v2=host=db port=5432 dbname=afriluck-v2
    depends_on:
      - db
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer.ini:/opt/bitnami/pgbouncer/conf/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -p 6432 -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # App service (scalable replicas)
  app:
    image: stevesmart1113/afriluck:latest
    depends_on:
      - db
    restart: no
    deploy:
      replicas: 3  # Start with 3, scale dynamically in production
      update_config:
        parallelism: 2
        delay: 10s
      resources:
        limits:
          cpus: '2'
          memory: 4G  # Match Java heap (-Xmx)
        reservations:
          memory: 2G
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pgbouncer:6432/afriluck-v2  # Use PgBouncer!
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JAVA_OPTS=-Xms2g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200  # GC tuning
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NGINX Load Balancer (optimized)
  nginx:
    build: ./nginx
    ports:
      - "8080:8080"
      - "443:443"  # Add if using SSL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - app-network
    depends_on:
      - app

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
    driver: local