worker_processes auto;
worker_rlimit_nofile 100000;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    sendfile on;

    # Timeouts optimized for high throughput
    proxy_connect_timeout 5s;
    proxy_send_timeout 20s;
    proxy_read_timeout 20s;
    keepalive_timeout 30s;
    keepalive_requests 10000;

    # Buffer optimizations
    proxy_buffer_size 16k;
    proxy_buffers 256 16k;
    proxy_busy_buffers_size 32k;

    upstream app_servers {
            least_conn;
            server app:8000 fail_timeout=10s max_fails=5;
            server app:8000 fail_timeout=10s max_fails=5;
            server app:8000 fail_timeout=10s max_fails=5;
            server app:8000 fail_timeout=10s max_fails=5;
            server app:8000 fail_timeout=10s max_fails=5;
    }

    server {

        listen 8080;
        allow 41.215.165.236;
        allow 5.9.86.210;
        allow 5.9.61.79;
        allow 5.75.226.153;
        allow 192.168.65.1;
        allow 78.47.150.35;
        allow 154.161.167.207;
        allow 193.34.212.75;
        allow 154.161.128.53;
        allow 10.180.180.18;
        deny all;
        error_page 403 = @access_denied;

        location / {
            proxy_pass         http://app_servers;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
        }

        location @access_denied {
             add_header Content-Type application/json;
             return 403 '{"error": "Access Denied", "message": "You do not have permission to access this resource."}';
        }
    }
}